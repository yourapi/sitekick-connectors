# Check whether the website has a secure https connection. Also get the issuer of the ssl certificate.

type: StrInt

domain: << self.attributes.domain >>
homepage: << functions.hosting.homepage(domain) >>
certificate: << functions.hosting.analyze_certificate(domain, attempts=1) >>

index:
    issuer: << certificate.issuer >> -> str
    valid_from: << certificate.validFrom >> -> str
    valid_to: << certificate.validTo >> -> str
    invalid: << certificate.invalid >> -> str
    https: << homepage.https >> -> int
    domain_redirected: << homepage.domain_redirected >> -> int
    valid: << certificate and not certificate.invalid >> -> int
    paid_provider: << not regex.fullmatch('\w+\d+', certificate.issuer) >> -> int
    # Let's encrypt has R10 or R11, migrating to E1 etc in the issuer name

refresh:
    every: << "day" if not index.valid else "3 months" >>
