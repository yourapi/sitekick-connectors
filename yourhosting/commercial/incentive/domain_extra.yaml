# Check the registration of the specified tlds. Have to call it different from `domain`, because the domain key is
# already taken by the domain entity.

type: JsonStrInt

domain: << self.attributes.domain >>

tlds:
  - nl
  - be
  - eu
  - com
  - online
  - de
  - net
  - org
  - email
  - tel

availability: << functions.hosting.available_tlds(domain, tlds) >>
registered_domains: << functions.yourhosting.commercial.incentives.registered_domains(self, availability) >>

json:
  availability: << availability >>
  registered: << registered_domains >>
  valid: << len(registered_domains) > 0 >>
  count: << len(registered_domains) >>

set-incentive: << functions.yourhosting.commercial.incentives.set_incentive_points(self, json.count) >>

code:
  import:
    - arrow  # Does not work yet; at this moment a fixed import, so fake

refresh:
  every: << "day" if arrow.get(self.meta.created_at) < arrow.now().shift(months=3) else "never" >>
