# Check whether the website has a secure https connection. Also get the issuer of the ssl certificate.

type: JsonStrInt

domain: << self.attributes.domain >>

tlds:
  - nl
  - be
  - eu
  - com
  - online
  - de
  - net
  - org
  - email
  - tel

availability: << functions.sitekick.hosting.available_tlds(domain, tlds) >>
registered_domains: << functions.yourhosting.commercial.incentives.registered_domains(self, availability) >>

json:
  availability: << availability >>
  registered: << registered_domains >>
  valid: << len(registered_domains) > 0 >>
  count: << len(registered_domains) >>

code:
  import:
    - arrow  # Does not work yet; at this moment a fixed import

refresh:
  every: << "75 seconds" if arrow.get(self.meta.created_at) < arrow.now().shift(months=3) else "never" >>
