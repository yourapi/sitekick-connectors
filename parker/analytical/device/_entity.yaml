attributes:
    type: JsonStrInt
    refresh: never

relationships:
    parker/analytical/measurement:
        cardinality:
            # Cardinality can be 1-1, 1-inf, inf-1 and inf-inf and optional.
            # (https://vertabelo.com/blog/cardinality-in-data-modeling/)
            # The cardinality is indicated using the possible counts of the relation.
            from: "1"  # a measurement is always related to a device
            to: ">= 0"  # a domain can have multiple measurements

on_create:
    include: "*"