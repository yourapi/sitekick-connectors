type: StrInt  # Type of the data-form will be determined automatically in the future

data: << functions.hosting.update_subscription(item) >>

index:
    product_slugs: << data.product_slugs >> -> str
    category: << data.category >> -> str
    start_date: << data.start_date >> -> str
    brand: << data.brand >> -> str

item:  # In the far, far future: also use optional synonym, like domain
    meta:
        created_at: << data.start_date >> -> timestamp

refresh: never
