type: StrInt  # Type of the data-form will be determined automatically in the future
# TBD: include dns, whois and category instead of copy-paste!!!

include:
    - whois
    - dns

index:
    registrar: << include.whois.registrar >> -> str
    ns_whois: << ','.join(include.whois.name_servers) >> -> str
    status_whois: << 1 if include.whois.status in {'active'} else 0 >> -> int
    ns_dns: << ','.join(include.dns.ns) >> -> str
    a_fqdn: << ','.join(include.dns.a_fqdn) >> -> str
