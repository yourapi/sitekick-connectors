type: Json  # Type of the data-form will be determined automatically in the future

description: >-
    Check the availability of domain names with different top-level domains (TLDs) for a given domain. 
    The tlds to check can be specified in the query parameter `tlds`, separated by spaces.
    Default: eu com be de me net nu org online

params:
    tlds: "eu com be de me net nu org online"

json:
    availability: << functions.hosting.available_tlds(params.domain, params.tlds) >>

refresh: on-demand

# Transient does not store the result and always refreshes when requested; the used mechanism in the platform is not
# very elegant, have to refine in the future.
