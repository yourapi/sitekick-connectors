code: |
    from pathlib import Path
    import sitekick.encoding.json as json

    def lighthouse_summary(lighthouse: dict) -> dict:
        """Filter only the fields with scores from the lighthouse result, to have a small yet relevant summary"""
        result = {'audits': {}, 'categories': {}}
        for name, audit in lighthouse['lighthouseResult']['audits'].items():
            result['audits'].update({name: {k: v for k, v in audit.items()
                                            if k in {'score', 'displayValue', 'numericValue', 'numericUnit'}}})
        for name, category in lighthouse['lighthouseResult']['categories'].items():
            result['categories'].update({name: {k: v for k, v in category.items()
                                                if k in {'score'}}})
            result['categories'][name]['auditRefs'] = [e for e in category['auditRefs'] if e['weight']]
        result['categoryGroups'] = lighthouse['lighthouseResult']['categoryGroups']
        return result
        

