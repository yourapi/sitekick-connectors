type: StrInt  # Type of the data-form will be determined automatically in the future
# TBD: include dns, whois and category instead of copy-paste!!!

include:
    - category
    - rtr
    - whois
    - dns

# Check availability of a domain name. Do the general check on availability
registered: << f.hosting.domain_status(params.domain) >>

whois: << functions.hosting.whois(params.domain) if registered == 'taken' else {} >>

dns: << functions.hosting.nslookup(params.domain, 'common', substitutions) if registered == 'taken' else {} >>

category: << functions.hosting.category_by_content(params.domain, category_keywords) if dns.generic.a1 else {} >>

data: << functions.hosting.supercat(registered=registered, whois=whois, dns=dns, category=category) >>

index:
    category: << data.category >> -> str
    subcategory: << data.subcategory >> -> str
    subscription: << self.attributes.subscription.category >> -> str
    slugs: << self.attributes.subscription.slugs >> -> str

refresh:
    every: << 'day' if index.category != 'active' else 'month' >>
