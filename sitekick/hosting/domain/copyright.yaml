type: StrInt  # Type of the data-form will be determined automatically in the future

include: homepage

requires: << include.homepage.final_url >>

content: << functions.hosting.content(include.homepage.final_url) >>
regex: <<
    regex.findall(r"(copyright|\(c\)|©)\s*((\S{0,20}\s*){0,3}?)([\d\s\-]+)", content.text, regex.I + regex.DOTALL) +
    regex.findall(r"(copyright)\s*((\S{0,20}\s*?){0,3})?([\d\s\-]+)", content.html, regex.I + regex.DOTALL) 
    >>
# The regex ignores up to 3 intermediate words, and includes only the last 2-4 digits of the expression.
# So © 2013‑2025 returns 2025
match: << [group[-1] for group in regex if regex.match('.*\d{2,4}', group[-1])] >>

requires1: << match >>
# If multiple requirements on different locations, just add a number

year1: << max(int((m.replace('-', ' ').strip()).rsplit()[-1]) for m in match) >>
year: << year1 if year1 > 1900 else year1 + 1900 if year1 > 80 else year1 + 2000  >>

requires2: << 1980 <= year <= datetime.date.today().year >>

index:
    year: << year >> -> int
