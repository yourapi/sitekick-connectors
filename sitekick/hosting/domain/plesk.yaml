type: Json  # Type of the data-form will be determined automatically in the future

params:
    key: str

raw_data: << functions.data.get_pushed_data(params.key) >>
requires(403): << functions.hosting.server.validation.check_domain_ip(raw_data) >>

data: << functions.hosting.server.plesk.parse_plesk_output(raw_data.payload.info) >>

json:
    domain-status: << data.general.domain_status >>
    creation-date: << data.general.creation_date >>
    expiration-date: << data.general.expiration_date >>
    disk-space-limit: << data.general.disk_space_limit >>
    size: << data.general.size >>
    traffic: << data.general.traffic >>
    hard-disk-quota: << data.hosting.hard_disk_quota >>
    disk-space-httpdocs: << data.hosting.disk_space_used_by_httpdocs >>
    disk-space-logs: << data.hosting.disk_space_used_by_log_files_and_statistical_reports >>
    web-statistics: << data.hosting.web_statistics >>
    total-web-users: << data.web_users.total >>
    mailboxes: << data.mail_accounts.mailboxes >>
    payloadbase-count: << data.databases.total >>
    payloadbase-size: << data.database.total_size >>
    web-applications-count: << data.web_applications.total >>
    subscription: << data.subscription_information.plan_details >>

# Now, add a relation between the server and the domain. Do it at both ends and ignore errors, so relationship is always made

simple-file:
    plesk.json: << data >>  # Data is quite convoluted

# Stored offline, for individual items to fetch, no querying, no presence in lists. Can be multiple files when a list
# is specified, are automatically named and optionally named explicitly
refresh: never
