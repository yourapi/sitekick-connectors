type: Json  # Type of the data-form will be determined automatically in the future

params:
    filename: str

raw_data: << open(params.filename).read() >>

data: << functions.hosting.server.plesk.parse_plesk_output(raw_data) >>

json:
    php_version: << data.php_version >>
    Server: << data.Server >>
    mail_accounts: << data.info["Mail Accounts"].Mailboxes >>
    provider: << data.provider >>
    provider-version: << data.provider_version >>
    plesk-version: << data.plesk_version >>
    plugins: << data.wp_plugins.plugins >>
    themes: << data.wp_plugins.themes >>
    wp_version: << data.wp_plugins.installation.Version >>
    wp_state: << data.wp_plugins.installation.State >>
    wp_latest_version: << data.wp_plugins.installation["Latest Version"] >>

simple-file:
    plesk.json: << data >>  # Data is quite convoluted

# Stored offline, for individual items to fetch, no querying, no presence in lists. Can be multiple files when a list
# is specified, are automatically named and optionally named explicitly
refresh: never
