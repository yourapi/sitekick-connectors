type: Json  # Type of the data-form will be determined automatically in the future

params:
    key: str

raw_data: << functions.data.get_pushed_data(params.key) >>
data: << functions.hosting.server.plesk.parse_plesk_output(raw_data.info) >>

json:
    domain-status: << data.general['domain status'] >>
    creation-date: << data.general['creation date'] >>
    expiration-date: << data.general['expiration date'] >>
    disk-space-limit-date: << data.general['disk space limit'] >>
    size: << data.general['size'] >>
    traffic: << data.general['traffic'] >>
    hard-disk-quota: << data.hosting['hard disk quota'] >>
    disk-space-httpdocs: << data.hosting['Disk space used by httpdocs'] >>
    disk-space-logs: << data.hosting['Disk space used by Log files and statistical reports'] >>
    web-statistics: << data.hosting['web statistics'] >>
    total-web-users: << data['web users']['total'] >>
    mailboxes: << data['mail accounts']['mailboxes'] >>
    database-count: << data['databases']['total'] >>
    database-size: << data['databases']['total size'] >>
    web-applications-count: << data['web applications']['total'] >>
    subscription: << data['subscription information']['plan details'] >>

# Now, add a relation between the server and the domain. Do it at both ends and ignore errors, so relationship is always made

simple-file:
    plesk.json: << data >>  # Data is quite convoluted

# Stored offline, for individual items to fetch, no querying, no presence in lists. Can be multiple files when a list
# is specified, are automatically named and optionally named explicitly
refresh: never
