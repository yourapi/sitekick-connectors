type: StrInt  # Type of the data-form will be determined automatically in the future
# TBD: include dns, whois and category instead of copy-paste!!!

include:
    - category
    - rtr
    - whois
    - dns

# Check availability of a domain name. Do the general check on availability
registered: << not include.rtr.attributes.available >>

data: << functions.hosting.supercat(registered=registered, whois=include.whois, dns=include.dns, category=include.category) >>

index:
    category: << data.category >> -> str
    subcategory: << data.subcategory >> -> str
    subscription: << self.attributes.subscription.category >> -> str
    slugs: << self.attributes.subscription.slugs >> -> str

refresh:
    every: << 'day' if index.category != 'active' else 'month' >>
