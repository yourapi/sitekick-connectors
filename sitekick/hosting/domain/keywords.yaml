params:
    keyword: null
    keywords: ""

type: Empty  # Type of the data-form will be determined automatically in the future

code: |
    month_map = {datetime.date(2000, i, 1).strftime('%B'): i for i in range(1, 13)}
    
    def convert_month(d):        
        if isinstance(d, dict):
            return {k: convert_month(v) for k, v in d.items()}
        elif isinstance(d, list):
            return [convert_month(e) for e in d]
        elif isinstance(d, str):
            return month_map.get(d, d)
        else:
            return d
    

url: "https://api.keywordseverywhere.com/v1/get_keyword_data"

headers:
    Authorization: "Bearer <<<--gAAAAABnmefZ1shUYA8kc9wYUZJNwXtaPdKLGxjR-tWoPZGxK4VLykFJU2wCbOisS9-
-a4Sd4DlZFZAeF8YFENb-J7qP1dsTluWTwOikczx9hNtGzblmyTA=-->>>"
    Accept: application/json

body:
    dataSource: cli
    currency: eur
    "kw[]": << ','.join(functions.hosting.make_keywords(params.keyword, params.keywords, domain=params.domain)) >>

data_raw: << f.http.request.post(url, data=body, headers=headers).json() >>

data: << convert_month(functions.convert.convert_type(data_raw, int, float)) >>  # Data contains str repr for float and int; convert them where applicable

simple-file:
    full.json: << data.data >>  # Only get the data content; ignore 'credits' and 'time' fields
