type: FloatInt  # Type of the data-form will be determined automatically in the future

url: "https://domdetailer.com/api/checkDomain.php"
params:
    app: 'sitekick'
    apikey: '<<<--gAAAAABnOwjPClegLfoELkk7NEiWNpqmeMhGJPisrzpVWx6ja51jqIL_RzcIxLRqRc42AJVTHBjoFPGy1FT5l9Euwpvl7_15tg==-->>>'
    domain: << params.domain >>


data: << functions.convert.convert_type(f.http.request.get(url=url, params=params).json(), int, float) >>  # Data contains str repr for float and int; convert them where applicable

index: # Index of the data-form, for querying and data-analysis.
    majesticCF: << data.majesticCF >> -> int
    majesticTF: << data.majesticTF >> -> int
    mozLinks: << data.mozLinks >> -> int
    majesticRefSubnets: << data.majesticRefSubnets >> -> int
    majesticLinks: << data.majesticLinks >> -> float
    mozRank: << data.mozRank >> -> float
    majesticRefDomains: << data.majesticRefDomains >> -> float
    majesticIPs: << data.majesticIPs >> -> float


simple-file:   # simple file only has name and content, access is private, content-type is automatic. Is identical to above spec in complete file spec.
    full.json: << data >>

transient: null
# Not stored, only used for the current session, no querying, no presence in lists
