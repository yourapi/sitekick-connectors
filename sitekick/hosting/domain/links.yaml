type: StrInt  # Type of the data-form will be determined automatically in the future

include: homepage

requires: << include.homepage.final_url >>

links: << functions.hosting.link_check(include.homepage.final_url) >>

index:
    valid: << len([link for link in links if link.get('valid')]) >> -> int
    invalid: << len([link for link in links if not link.get('valid')]) >> -> int
    urls: << data.WriterCSV([link for link in links if not link.get('valid')][:10], fieldnames =('result', 'url', 'parentname')).content().decode('utf-8') >> -> str

file: << json.dumps(links) >>
