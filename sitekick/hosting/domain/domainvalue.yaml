type: FloatInt

include:
    - domdetailer
    - keywords
    - whois

result: |
    << functions.hosting.domain_value(
        params.domain,
        include.whois.attributes,
        get(include.keywords.links.files['full.json']).json(),
        include.domdetailer.attributes) >>

index:
    value: << result.domainvalue_num >> -> float
    value_rounded: << result.domainvalue_num_rounded >> -> float
    searchvol: << result.searchvol >> -> float
    cpc: << result.cpc >> -> float
    mozRank: << round(result.mozRank * 10) >> -> int

bff: extra  # The default bff to apply to the retrieved data. Interferes with getting the 'naked' data when refreshing
# a new item, so disabled for now. For long term: have to find out what goes wrong and repair it. Hint: it gets
# refreshed 25 times when performed on a new item which not necessarily has a key.